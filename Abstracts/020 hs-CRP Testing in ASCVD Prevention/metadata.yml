"hook": "High-sensitivity C-reactive protein testing is used in less than one percent of patients eligible for cardiovascular prevention"
"summary": "In our recent analysis, we looked at how often doctors use a blood test that measures inflammation (high-sensitivity C-reactive protein) to help prevent first and recurrent heart attacks and strokes. We found that despite guideline recommendations, the test is rarely ordered in routine care, but when it is used, it frequently leads to starting cholesterol-lowering medications like statins. This matters because wider use of the test could identify more people at risk who might benefit from early treatment, potentially preventing many cardiovascular events."
