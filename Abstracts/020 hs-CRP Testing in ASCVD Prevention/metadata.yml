"summary": "A recent analysis looked at how often doctors use a blood test that measures inflammation (high-sensitivity C-reactive protein) to help prevent first and recurrent heart attacks and strokes. The study found that despite guideline recommendations, the test is rarely ordered in routine care, but when it is used, it frequently leads to starting cholesterol-lowering medications like statins. This matters because wider use of the test could identify more people at risk who might benefit from early treatment, potentially preventing many cardiovascular events."
"hook": "An inflammation blood test is rarely ordered for heart attack prevention, but when used it often prompts statin prescriptions"
