"journal_abbrev": "Gastroenterology"
"tags": ["Hepatology", "Endocrinology"]
"summary": "For people with a combination of metabolic and alcohol-related liver disease, a class of medications that mimic a natural hormone to control blood sugar and reduce appetite, known as GLP-1 agonists, may help prevent the condition from worsening. A new study in Gastroenterology found that patients taking these drugs had a significantly lower risk of their liver disease progressing to more severe stages. The results suggest that GLP-1 agonists, already widely used for diabetes and weight loss, could offer a much-needed treatment option for a liver condition that currently has few effective therapies."
"hook": "GLP-1 agonists help prevent liver disease from worsening in patients with combined metabolic and alcohol-related liver disease"
