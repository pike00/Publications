"title": "Increase in Mortality and Allograft Rejection Post-Liver Transplant in a Cohort Between 50-90 Years Old"
"authors":
- "H Khan"
- "N Duong"
- "CW Pike"
- "J Muralidharan"
"journal": "The American Journal of Gastroenterology"
"date_published": "2025-10-01"
"pub_type": "Abstract/Poster"
"abstract_id": "S2879"
"tags": ["Hepatology"]
"summary": "A recent analysis of liver transplant recipients between 50 and 90 years old revealed that older age was linked to a higher risk of death and organ rejection following the procedure. The findings highlight that while transplantation can be life-saving, the chances of complications increase with age, likely due to the body's reduced ability to tolerate major surgery and the immune-suppressing drugs needed to prevent rejection. This information can help doctors and older patients have more realistic conversations about the potential benefits and drawbacks of pursuing a transplant."
"hook": "Older liver transplant recipients face a higher risk of death and organ rejection after the procedure"
