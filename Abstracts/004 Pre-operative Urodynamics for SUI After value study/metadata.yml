"summary": "A major clinical trial published in 2012 found that routine bladder function tests before surgery for stress urinary incontinence did not improve outcomes, suggesting the tests were often unnecessary. Researchers examined whether doctors changed their practice after this trial by looking at the use of these tests in women preparing for incontinence surgery. They found a significant and lasting decrease in the use of pre-operative bladder testing, showing that the trial's evidence successfully reduced low-value care. This shift matters because it spares patients an invasive, uncomfortable, and costly procedure that does not improve their surgical results."
"hook": "Routine bladder testing before stress incontinence surgery dropped sharply after a landmark trial showed it was unnecessary"
