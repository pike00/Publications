"hook": "Pre-operative bladder testing for stress incontinence surgery dropped significantly after a landmark trial said to skip it"
"summary": "In a major clinical trial we published in 2012, we found that routine bladder function tests before surgery for stress urinary incontinence did not improve outcomes, suggesting the tests were often unnecessary. We examined whether doctors changed their practice after this trial by looking at the use of these tests in women preparing for incontinence surgery. We found a significant and lasting decrease in the use of pre-operative bladder testing, showing that our trial's evidence successfully reduced low-value care. This shift matters because it spares patients an invasive, uncomfortable, and costly procedure that does not improve their surgical results."
