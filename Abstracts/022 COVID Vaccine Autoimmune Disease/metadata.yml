"title": "Comparative risk of new-onset autoimmune disease following COVID-19 mRNA versus DNA vaccination: A propensity-matched cohort study using the epic cosmos database"
"authors":
- "N Srinivasan"
- "M Jackson"
- "CW Pike"
- "K Sarin"
"journal": "Journal of Investigative Dermatology"
"date_published": "2026-05-01"
"pub_type": "Abstract/Poster"
"abstract_id": "0279"
"tags": ["Infectious Disease"]
"hook": "mRNA COVID-19 vaccines carried a slightly higher risk of new autoimmune disease than DNA-based vaccines"
"summary": "We compared the likelihood of developing new autoimmune disorders after receiving either an mRNA-based COVID-19 vaccine (such as Pfizer or Moderna) or a DNA-based vaccine (such as Johnson & Johnson). Using a large database and matching patients with similar characteristics, we found no meaningful difference in the risk of new-onset autoimmune conditions between the two vaccine types. Our results provide reassurance that both vaccine platforms have comparable safety profiles regarding autoimmune reactions, which can help inform personal and public health decisions."
