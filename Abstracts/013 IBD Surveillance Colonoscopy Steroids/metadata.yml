"hook": "Patients with quiescent inflammatory bowel disease face a higher risk of steroid prescription after a surveillance colonoscopy"
"summary": "People with inflammatory bowel disease (IBD) that is in remission often undergo surveillance colonoscopies to screen for colon cancer. We examined whether these routine procedures might trigger a flare-up by tracking new prescriptions for steroids, a common treatment for IBD symptoms. We found that patients who had a surveillance colonoscopy were more likely to receive a steroid prescription in the following months compared to similar patients who did not have the procedure. This suggests that even a standard colonoscopy could provoke disease activity in some individuals, highlighting a potential risk that patients and doctors should weigh when considering the benefits of cancer screening."
