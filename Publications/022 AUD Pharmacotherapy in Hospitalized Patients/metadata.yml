"abstract": "INTRODUCTION: Alcohol use disorder (AUD) poses a significant public health challenge. Despite the availability of effective pharmacological treatments, their use during hospitalization remains limited. This study aimed to evaluate the prevalence of medication for AUD (MAUD) during inpatient admissions and assess its association with subsequent emergency department (ED) visits and hospital readmissions.\n\nMATERIALS AND METHODS: We conducted a retrospective cohort study using electronic health records from Stanford Health Care (SHC) between 2015 and 2023. Hospitalized adults with a documented diagnosis of AUD (n = 7560) were categorized based on whether they received acamprosate, naltrexone, or disulfiram during admission. Outcomes included ED visits and hospital readmissions at 3- and 12-month follow-up. High-dimensional propensity score (HdPS) matching was used to control for baseline confounders.\n\nRESULTS: Only 3% of patients with AUD received pharmacotherapy during hospitalization. After HdPS matching, we compared 131 patients who received MAUD to 131 patients who did not. No statistically significant differences were found in ED visits within 3 months (OR = .83; 95% CI: .45, 1.51) or 12 months (OR = .66; 95% CI: .39, 1.14), nor in hospital readmissions at 3 months (OR = .87; 95% CI: .47, 1.59) or 12 months (OR = .81; 95% CI: .58, 1.12).\n\nCONCLUSIONS: MAUD was rarely administered during hospitalization, representing a critical missed opportunity for intervention. While effect estimates favored treated patients, limited sample size precluded definitive conclusions. Efforts to improve implementation of AUD pharmacotherapy in inpatient settings are warranted."
"summary": "A new study examined how often hospitalized patients with alcohol use disorder were given medications to help them stop or reduce drinking, and whether receiving these drugs affected their chances of returning to the emergency room or being readmitted to the hospital. Researchers found that only 3% of patients received such medications during their hospital stay, a strikingly low rate. Although patients who got the medications tended to have fewer emergency visits and hospital readmissions over the following year, the differences were not statistically significant, likely because so few patients were treated. The findings reveal a major missed opportunity to start effective treatment for alcohol problems during a hospital stay, and the authors stress the need for better use of these medications in inpatient settings."
"hook": "Few hospitalized patients with alcohol use disorder receive medications that could help them"
