"hook": "Adults with type 2 diabetes prescribed SGLT2 inhibitors had a lower incidence of stroke"
"summary": "We used real-world health records to compare the risk of non-fatal stroke in people with type 2 diabetes who were prescribed sodium-glucose cotransporter-2 inhibitors versus other diabetes medications. We found that those taking these drugs had a lower risk of suffering a non-fatal stroke. This finding is important because it suggests that, beyond lowering blood sugar, this class of medications may offer additional protection against stroke, helping patients and doctors make more informed treatment choices."
