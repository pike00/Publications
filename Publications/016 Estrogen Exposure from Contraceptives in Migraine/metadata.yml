"abstract": "BackgroundMany guidelines list migraine with aura (MwA) as a contraindication to estrogen-containing combined hormonal contraceptives (CHCs) due to vascular risks. However, current evidence is based on small sample studies with potential influence by confounding factors. Additionally, few studies have examined the vascular risk associated with modern CHCs with lower dose estrogen, particularly in relation to aura status. The present study aims to investigate the vascular risk of modern CHCs in women with migraine with and without aura.MethodsWe used a de-identified electronic medical record database with 120 million patients across multiple health systems in the United States of America. We included female patients aged 18-45 years who received a migraine diagnosis code, had at least three office visits within three years, and were prescribed at least one migraine-specific medication within 6 months following the first outpatient visit. All data after 2010 were included. Patients with prior cardiovascular events were excluded. Our composite endpoint consisted of acute ischemic stroke, acute myocardial infarction, deep vein thrombosis/pulmonary embolism and intravenous thrombolytic administration. We stratified our analysis according to CHC exposure and aura status and compared the incidence of the endpoint with high-dimensional propensity score-matching between CHC users and non-users in (i) the overall cohort, (ii) MwA and (iii) migraine without aura (MwoA); between MwA and MwoA in (iv) patients prescribed CHCs; and in (v) those without CHC prescriptions.ResultsWe included 5535 patients who received CHC prescriptions and 21,520 who did not. 114 (2.06%) of CHC users and 547 (2.54%) of CHC non-users had at least one vascular event. With propensity score-matched comparison, the composite endpoint did not significantly differ between CHC and non-CHC in the overall migraine group, those with MwA and the MwoA group. In those prescribed CHC, MwA and MwoA did not differ in all the outcomes. For CHC non-users, MwA was associated with a higher incidence of acute ischemic stroke (hazard ratio = 2.45; 95% confidence interval = 1.58-3.78; p < 0.001; n = 6201 in each group) and the composite endpoint (hazard ratio = 1.34; 95% confidence interval = 1.08-1.67; p = 0.008).ConclusionsOur real-world study showed that exposure to modern CHC was not associated with a significant increase in vascular risk in women aged 18-45 years with migraine, MwA or MwoA who have no prior cardiovascular events. However, in those who never received CHC, MwA was associated with higher vascular risks compared to MwoA. While limitations exist using large scale electronic medical record databases for analysis, our results suggest that carefully designed prospective studies should be conducted to reassess the vascular risk associated with CHC use in women with migraine, especially MwA."
"summary": "Researchers examined whether modern low-dose estrogen-containing birth control pills raise the risk of stroke, heart attack, or blood clots in women with migraines, including those who experience aura. Using a large database of medical records, they compared vascular events between women who used these contraceptives and those who did not, and found no significant increase in risk for users, even among those with migraine with aura. Interestingly, among women not taking these contraceptives, having migraine with aura was linked to a higher risk of stroke and other vascular events. These findings challenge current guidelines that often restrict estrogen-containing contraceptives for women with migraine with aura, suggesting that modern low-dose formulations may be safer than previously thought and highlighting the need for updated research to guide prescribing decisions."
