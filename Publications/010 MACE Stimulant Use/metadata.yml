"abstract": "OBJECTIVES: Individuals with stimulant use disorders (StSUDs) present an elevated risk of cardiovascular complications compared with the general population. However, it remains unclear whether, within the subpopulation of individuals with substance use disorders (SUDs), those specifically affected by StSUDs face even higher cardiovascular complications.\n\nMETHODS: We conducted a retrospective cohort study using the EVERSANA databank, spanning from January 2015 to December 2023. The EVERSANA data set comprises deidentified electronic health record data aggregated and standardized across the United States. Participants included patients diagnosed with SUDs, encompassing alcohol, cannabis, opioids, stimulants, tobacco, hallucinogens, sedative-hypnotics, or inhalants. We employed the International Classification of Disease 10th (ICD-10) version codes to define the presence of StSUD and SUD. Major adverse cardiac events (MACE) were assessed, and Cox proportional hazard ratios were adjusted using high-dimensional propensity score (hdPS) matching to account for potential confounders.\n\nRESULTS: Among 137,106 patients with SUD, 7706 (5.6%) had StSUD. The cohort was 50.2% female, 53.0% non-White, with a mean age of 49.1 years (SD±15). After adjustment, stimulant users exhibited significantly higher MACE rates (HR=1.37, 95% CI: 1.22-1.53, P <0.001), including an elevated risk of death (HR=1.23, 95% CI: 1.02-1.47, P =0.026).\n\nCONCLUSION: Individuals with StSUD face increased MACE compared with those with nonstimulant SUDs."
"summary": "A new analysis of health records compared the risk of serious heart problems, like heart attacks, strokes, and heart-related death, in people with addiction to stimulants (such as cocaine or methamphetamine) versus those with other substance use disorders, including alcohol, cannabis, or opioids. After carefully matching patients to account for differences in age, sex, and other health factors, researchers found that stimulant users had a 37% higher chance of experiencing a major cardiac event and a 23% higher risk of dying from any cause. The findings highlight that stimulant addiction carries a uniquely dangerous burden on the heart, even when compared to other substance addictions, underscoring the need for targeted heart health monitoring and early intervention in this group."
"hook": "Stimulant use disorder carries a higher risk of major cardiac events than other substance use disorders"
