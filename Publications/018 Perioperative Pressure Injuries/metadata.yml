"summary": "Researchers examined the traits of patients who developed pressure injuries, commonly known as bedsores, around the time of surgery. By describing the typical age, health conditions, and surgical details of those affected, the study highlights which patients are most vulnerable to these skin and tissue wounds. Recognizing these patterns can help surgical teams better identify at-risk individuals and take early preventive steps, potentially reducing the pain, extended hospital stays, and high costs associated with these injuries."
"hook": "Cardiovascular surgery patients account for most perioperative pressure injuries"
