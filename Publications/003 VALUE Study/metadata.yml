"title": "Has the use of preoperative urodynamics for stress urinary incontinence surgery changed following the VALUE study?"
"authors":
- "MB Clements"
- "JM Zillioux"
- "CW Pike"
- "DE Rapp"
"journal": "Neurourology and Urodynamics"
"date_published": "2020-06-19"
"doi": "10.1002/nau.24430"
"pub_type": "Journal Article"
"pmid": 32559352
"journal_abbrev": "Neurourol Urodyn"
"tags": ["Urology"]
"abstract": "AIMS: To assess whether routine urodynamic testing (UDT) in women undergoing slings for uncomplicated stress urinary incontinence (SUI) has decreased following publication of the landmark VALUE study, which recommended against routine UDT in uncomplicated SUI.\n\nMETHODS: We identified women in the Virginia All Payers Claims Database diagnosed with SUI between 2011 and 2016 using International Classification of Disease (ICD) codes (N39.3, 625.6). Appropriate ICD/CPT (current procedural terminology) codes were used to exclude non-index patients (prior anti-incontinence/prolapse surgery, urge incontinence, neurogenic bladder). Beta regression was used to assess for changes in the monthly proportion of urethral slings with preoperative UDT. Interventional ARIMA modeling was used to assess for a relationship between the date of VALUE (The Value of Urodynamic Evaluation) publication and the incidence of slings with preoperative UDT.\n\nRESULTS: Analysis identified 6740 women with SUI undergoing sling placement, with 343 non-index patients excluded. Of 6397 remaining women, 4026 (62.9%) underwent preoperative UDT. The annual number of slings with preoperative UDT declined from 748 to 402 between 2011 and 2016. Beta regression analysis demonstrated a decrease in the proportion of slings with preoperative UDT over the study (68%, 2011; 58%, 2016), with a statistically significant decrease in the proportion of slings with UDT after May 2012 (β coefficient, -.0093; P < .001). Interventional ARIMA models showed a trend toward decreasing slings with preoperative UDT after the VALUE trial (P = .057).\n\nCONCLUSIONS: Our analysis demonstrated a decrease in the proportion of women undergoing preoperative UDT in uncomplicated SUI patients following the VALUE study. Further research is needed to examine factors underlying UDT utilization trends and promote value-driven care."
"summary": "Researchers examined whether doctors changed their use of bladder function tests before surgery for stress urinary incontinence (urine leakage triggered by physical activity) after a major study called VALUE recommended against routine testing in straightforward cases. They analyzed insurance claims from over 6,000 women in Virginia who had a sling procedure between 2011 and 2016. The proportion of women who underwent preoperative bladder testing dropped from 68% in 2011 to 58% in 2016, with a significant decline after the VALUE study was published in May 2012. This shift suggests that clinical practice is responding to high-quality evidence, helping to avoid unnecessary tests and promote more efficient care."
