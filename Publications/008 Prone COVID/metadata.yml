"abstract": "OBJECTIVES: Prone positioning is widely used in mechanically ventilated patients with COVID-19; however, the specific clinical scenario in which the individual is most poised to benefit is not fully established. In patients with COVID-19 respiratory failure requiring mechanical ventilation, how effective is prone positioning in improving oxygenation and can that response be predicted?\n\nDESIGN: This is a retrospective observational study from two tertiary care centers including consecutive patients mechanically ventilated for COVID-19 from 3/1/2020 - 7/1/2021. The primary outcome is improvement in oxygenation as measured by PaO2/FiO2. We describe oxygenation before, during and after prone episodes with a focus on identifying patient, respiratory or ventilator variables that predict prone positioning success.\n\nSETTING: 2 Tertiary Care Academic Hospitals.\n\nPATIENTS: 125 patients mechanically ventilated for COVID-19 respiratory failure.\n\nINTERVENTIONS: Prone positioning.\n\nMAIN RESULTS: One hundred twenty-five patients underwent prone positioning a total of 309 times for a median duration of 23 hours IQR (14 - 49). On average, PaO2/FiO2 improved 19%: from 115 mm Hg (80 - 148) immediately before proning to 137 mm Hg (95 - 197) immediately after returning to the supine position. Prone episodes were more successful if the pre-prone PaO2/FiO2 was lower and if the patient was on inhaled epoprostenol (iEpo). For individuals with severe acute respiratory distress syndrome (ARDS) (PaO2/FiO2 < 100 prior to prone positioning) and on iEpo, the median improvement in PaO2/FiO2 was 27% in both instances.\n\nCONCLUSIONS: Prone positioning in mechanically ventilated patients with COVID-19 is generally associated with sustained improvements in oxygenation, which is made more likely by the concomitant use of iEpo and is more impactful in those who are more severely hypoxemic prior to prone positioning."
"hook": "Prone positioning improves oxygen levels most in the sickest COVID-19 patients and those on an inhaled lung drug"
"summary": "Turning ventilated COVID-19 patients onto their stomachs, a technique called prone positioning, generally improved blood oxygen levels by about 19% in our review of 125 patients across two hospitals. The benefit was even greater for those who started with very low oxygen levels or were also receiving an inhaled medication (epoprostenol) that widens blood vessels in the lungs, with these patients seeing a 27% boost. Our findings help intensive care teams better predict which individuals are most likely to respond well to this treatment, allowing for more tailored care."
